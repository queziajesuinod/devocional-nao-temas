version: "3.8"

# Stack do site 365 Vezes Não Temas! para Docker Swarm com Traefik.
#
#   docker build --build-arg CACHEBUST=$(date +%s) -t naotemas:latest .
#   docker stack deploy -c docker-compose.yml naotemas

services:
  naotemas_site:
    image: naotemas:latest
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.naotemas.rule=Host(`devocional.iecg.com.br`)
        - traefik.http.routers.naotemas.entrypoints=websecure
        - traefik.http.routers.naotemas.tls.certresolver=letsencryptresolver
        - traefik.http.routers.naotemas.service=naotemas
        - traefik.http.services.naotemas.loadbalancer.server.port=80

networks:
  network_public:
    external: true
