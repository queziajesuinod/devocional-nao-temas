server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O Traefik fica na frente e cuida do HTTPS; aqui só servimos arquivos.
    absolute_redirect off;

    # Compressão de texto
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf font/otf;

    # Verificação de saúde usada pelo HEALTHCHECK do Dockerfile
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok
";
    }

    # Endereços limpos: / abre index.html e /obrigado/ abre obrigado/index.html.
    # /obrigado (sem a barra) é redirecionado para /obrigado/ pelo próprio nginx.
    location / {
        try_files $uri $uri/ =404;
        # HTML sempre revalidado, para mudança de preço ou data aparecer na hora
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fontes e imagens mudam pouco: cache de 30 dias
    location ~* \.(?:ttf|otf|woff2?|jpg|jpeg|png|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Arquivos ocultos nunca são servidos
    location ~ /\. {
        deny all;
    }

    # Endereço que não existe volta para a página de venda
    error_page 404 /index.html;
}
